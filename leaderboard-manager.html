<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM Slippi Leaderboard Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 40px;
            padding: 25px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            background: #f8f9fa;
        }
        
        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-management {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .player-list {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 5px 0;
            background: #f1f3f4;
            border-radius: 4px;
            border-left: 4px solid #4285f4;
        }
        
        .player-code {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #1a73e8;
        }
        
        .remove-btn {
            background: #ea4335;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .remove-btn:hover {
            background: #d33b2c;
        }
        
        .add-player {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .add-player input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        
        .add-player input:focus {
            outline: none;
            border-color: #4285f4;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: #4285f4;
            color: white;
        }
        
        .btn-primary:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }
        
        .btn-success {
            background: #34a853;
            color: white;
        }
        
        .btn-success:hover {
            background: #2d8f47;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 168, 83, 0.3);
        }
        
        .btn-warning {
            background: #fbbc04;
            color: #1a1a1a;
        }
        
        .btn-warning:hover {
            background: #f9ab00;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 188, 4, 0.3);
        }
        
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: 500;
            text-align: center;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #cce7ff;
            color: #004085;
            border: 1px solid #b3d7ff;
        }
        
        .player-count {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .instructions {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        .instructions strong {
            color: #533f03;
        }
        
        @media (max-width: 768px) {
            .player-management {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 MM Slippi Leaderboard Manager</h1>
            <p>Manage players and update your leaderboard with ease</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>👥 Player Management <span class="player-count" id="playerCount">0 players</span></h2>
                
                <div class="instructions">
                    <strong>Connect Code Format:</strong> Use format like "MM#391", "CLICH#3", "ALEX#154" etc.
                </div>
                
                <div class="player-management">
                    <div>
                        <h3>Add New Player</h3>
                        <div class="add-player">
                            <input type="text" id="newPlayerCode" placeholder="Enter connect code (e.g., MM#391)" maxlength="10">
                            <button class="btn btn-primary" onclick="addPlayer()">Add Player</button>
                        </div>
                        
                        <h3>Current Players</h3>
                        <div class="player-list" id="playerList">
                            <!-- Players will be loaded here -->
                        </div>
                    </div>
                    
                    <div>
                        <h3>Quick Actions</h3>
                        <div class="actions">
                            <button class="btn btn-success" onclick="saveAndUpdate()">💾 Save & Update Leaderboard</button>
                            <button class="btn btn-warning" onclick="saveChanges()">💾 Save Changes Only</button>
                            <button class="btn btn-primary" onclick="loadPlayers()">🔄 Reload Players</button>
                        </div>
                        
                        <div class="status" id="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let players = [];
        
        // Load players from fetchStats.ts
        async function loadPlayers() {
            showStatus('Loading players...', 'info');
            try {
                const response = await fetch('cron/fetchStats.ts');
                const content = await response.text();
                
                // Extract the array from the return statement
                const match = content.match(/return\s*\[([\s\S]*?)\];/);
                if (match) {
                    const arrayContent = match[1];
                    // Extract quoted strings (connect codes)
                    const codeMatches = arrayContent.match(/"[^"]+"/g);
                    if (codeMatches) {
                        players = codeMatches.map(code => code.replace(/"/g, ''));
                        renderPlayers();
                        showStatus(`Loaded ${players.length} players successfully!`, 'success');
                    } else {
                        throw new Error('No player codes found');
                    }
                } else {
                    throw new Error('Could not parse player codes from file');
                }
            } catch (error) {
                console.error('Error loading players:', error);
                showStatus('Error loading players. Using default list.', 'error');
                // Fallback to default players
                players = ["MM#391","CLICH#3", "ALEX#154", "SNAP#1", "SGUN#420"];
                renderPlayers();
            }
        }
        
        function renderPlayers() {
            const playerList = document.getElementById('playerList');
            const playerCount = document.getElementById('playerCount');
            
            playerCount.textContent = `${players.length} players`;
            
            playerList.innerHTML = players.map((player, index) => `
                <div class="player-item">
                    <span class="player-code">${player}</span>
                    <button class="remove-btn" onclick="removePlayer(${index})">Remove</button>
                </div>
            `).join('');
        }
        
        function addPlayer() {
            const input = document.getElementById('newPlayerCode');
            const code = input.value.trim().toUpperCase();
            
            if (!code) {
                showStatus('Please enter a connect code', 'error');
                return;
            }
            
            // Basic validation
            if (!code.includes('#')) {
                showStatus('Connect code must include # (e.g., MM#391)', 'error');
                return;
            }
            
            if (players.includes(code)) {
                showStatus('Player already exists in the list', 'error');
                return;
            }
            
            players.push(code);
            input.value = '';
            renderPlayers();
            showStatus(`Added ${code} to the list`, 'success');
        }
        
        function removePlayer(index) {
            const removedPlayer = players[index];
            players.splice(index, 1);
            renderPlayers();
            showStatus(`Removed ${removedPlayer} from the list`, 'success');
        }
        
        async function saveChanges() {
            showStatus('Saving changes...', 'info');
            
            try {
                // Read the current fetchStats.ts file
                const response = await fetch('cron/fetchStats.ts');
                const content = await response.text();
                
                // Create the new array string
                const newArrayString = players.map(code => `"${code}"`).join(', ');
                
                // Replace the return array in the file
                const newContent = content.replace(
                    /return\s*\[([\s\S]*?)\];/,
                    `return [\n    ${newArrayString}\n  ];`
                );
                
                // This would need a backend endpoint to actually save the file
                // For now, we'll show the user what to copy
                showSaveInstructions(newContent);
                
            } catch (error) {
                console.error('Error saving:', error);
                showStatus('Error saving changes', 'error');
            }
        }
        
        function showSaveInstructions(newContent) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.8); z-index: 1000; display: flex;
                align-items: center; justify-content: center; padding: 20px;
            `;
            
            modal.innerHTML = `
                <div style="background: white; padding: 30px; border-radius: 12px; max-width: 800px; width: 100%; max-height: 80vh; overflow-y: auto;">
                    <h3 style="margin-bottom: 20px; color: #2c3e50;">📝 Manual Save Required</h3>
                    <p style="margin-bottom: 15px; color: #666;">Copy the updated player list and paste it into your <code>cron/fetchStats.ts</code> file:</p>
                    <textarea readonly style="width: 100%; height: 200px; font-family: monospace; font-size: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">${players.map(code => `"${code}"`).join(',\n    ')}</textarea>
                    <div style="margin-top: 20px; text-align: center;">
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" style="padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 6px; cursor: pointer;">Close</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            showStatus('Player list ready to copy!', 'success');
        }
        
        async function saveAndUpdate() {
            showStatus('Saving changes and updating leaderboard...', 'info');
            
            // First save changes
            await saveChanges();
            
            // Then show update instructions
            setTimeout(() => {
                showStatus('After saving the file, run: npm run update-and-deploy', 'info');
            }, 2000);
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 5000);
            }
        }
        
        // Handle Enter key in input
        document.getElementById('newPlayerCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPlayer();
            }
        });
        
        // Load players on page load
        loadPlayers();
    </script>
</body>
</html>
