name: Update slippi rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

# needs to push the gh-pages site and the artifacts data branch
permissions:
  contents: write

concurrency:
  group: update-slippi-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Git
      run: |
        git --version
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

    - uses: actions/setup-node@v4
      with:
        node-version: '21.6.1'

    - name: Install project dependencies
      run: yarn install

    - name: Load secrets
      run: |
        mkdir -p ./secrets
        cat << EOF > ./secrets/creds.json
        ${{ secrets.GOOGLE_CREDS }}
        EOF
      shell: bash

    - name: Download saved data from artifacts branch
      run: |
        mkdir -p cron/data
        git fetch origin artifacts || true
        restore() { git show "origin/artifacts:$1" > "cron/data/$2" 2>/dev/null || rm -f "cron/data/$2"; }
        # last run's players become this run's "new" file, which fetchStats rotates to "old"
        restore players-new.json players-new.json
        [ -s cron/data/players-new.json ] || restore players-old.json players-new.json
        restore timestamp.json timestamp.json
        restore history.json history.json
        restore gm-pool.json gm-pool.json
        restore gm-threshold.json gm-threshold.json
        ls -la cron/data

    - name: Run ranking update and deploy
      run: |
        ./cron/run.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Save data to artifacts branch
      run: |
        git checkout --orphan artifacts-temp
        git rm -rf . > /dev/null
        for f in players-new.json timestamp.json history.json gm-pool.json gm-threshold.json; do
          [ -f "cron/data/$f" ] && cp "cron/data/$f" "$f" && git add -f "$f"
        done
        git commit -m "Update player data"
        git push -f origin HEAD:artifacts
